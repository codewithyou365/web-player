<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="动画片">
<link rel="apple-touch-icon" href="/icon-180.png">
<title data-i18n="search">搜索</title>
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
<script src="/back.js"></script>
</head>
<body>
<header>
  <a class="icon-btn" href="/" data-back data-i18n-title="back">⬅️</a>
  <a class="icon-btn" href="/" data-i18n-title="home">🏠</a>
  <form class="search-form" id="form">
    <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" enterkeyhint="search">
    <button class="btn primary" id="go" data-i18n="search"></button>
  </form>
</header>
<main class="history" id="list"><div class="empty" data-i18n="searchIntro"></div></main>
<script>
I18n.apply();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const list = document.getElementById('list');
const input = document.getElementById('q');
const go = document.getElementById('go');

function render(data) {
  const items = data.results;
  if (!items.length) { list.innerHTML = `<div class="empty">${esc(t('noResults'))}</div>`; return; }
  list.innerHTML = items.map((s) => `
    <a class="hist-item" href="/player.html?id=${s.id}${s.episode != null ? '&ep=' + s.episode : s.pick ? '&pick=1' : ''}" title="${esc(s.relPath)}">
      <div class="hist-cover">
        ${s.cover ? `<img src="${s.cover}" alt="" loading="lazy">` : '<div class="placeholder">🎞️</div>'}
      </div>
      <div class="hist-text">
        <div class="hist-name">${s.fav ? '❤️ ' : ''}${esc(s.name)}</div>
        <div class="hist-sub">${s.episode != null ? esc(t('epOf', { n: s.episode + 1, title: s.epTitle })) : t('nEps', { n: s.count }) + (s.pick ? t('pickHint') : '')}</div>
        <div class="hist-when">${esc(why(s.why))}</div>
      </div>
    </a>`).join('');
}

// 命中原因：服务端给结构化数据，这里按语言拼成文字
function why(w) {
  if (!w) return '';
  const p = { terms: w.terms || [], n: w.count, file: w.file, snippet: w.snippet };
  return t({ name: 'whyName', dir: 'whyDir', title: 'whyTitle', eps: 'whyEps', text: 'whyText' }[w.kind] || '', p);
}

// 还没建过索引：先让用户建一次
function renderNeedIndex(q) {
  list.innerHTML = `<div class="empty">${esc(t('needIndex'))}<br><br>
    <button class="btn primary" id="buildIdx">${esc(t('buildIndex'))}</button></div>`;
  document.getElementById('buildIdx').onclick = async (ev) => {
    ev.target.disabled = true;
    ev.target.textContent = t('building');
    const res = await fetch('/api/search/index', { method: 'POST' });
    if (res.ok) run(q);
    else list.innerHTML = `<div class="empty">${esc(t('buildFailed', { err: (await res.json().catch(() => ({}))).error || res.status }))}</div>`;
  };
}

async function run(q) {
  go.disabled = true;
  list.innerHTML = `<div class="empty">${t('searching')}</div>`;
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await res.json().catch(() => null);
    if (!res.ok || !data) list.innerHTML = `<div class="empty">${t('searchUnsupported')}</div>`;
    else if (data.needIndex) renderNeedIndex(q);
    else render(data);
  } catch {
    list.innerHTML = `<div class="empty">${t('offline')}</div>`;
  }
  go.disabled = false;
}

// 搜索词放进地址栏：从播放页返回时直接重新显示这次的结果
document.getElementById('form').onsubmit = (ev) => {
  ev.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.blur();
  history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  run(q);
};

const q0 = new URLSearchParams(location.search).get('q');
if (q0) { input.value = q0; run(q0); } else input.focus();
</script>
</body>
</html>
