<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="动画片">
<link rel="apple-touch-icon" href="/icon-180.png">
<title data-i18n="settings">设置</title>
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
<script src="/back.js"></script>
</head>
<body>
<header>
  <a class="icon-btn" href="/" data-back data-i18n-title="back">⬅️</a>
  <a class="icon-btn" href="/" data-i18n-title="home">🏠</a>
  <h1 data-i18n="settings"></h1>
</header>
<main class="settings">
  <div class="lan" id="lan" hidden></div>
  <h2 data-i18n="language"></h2>
  <select id="lang" class="lang-select"></select>

  <h2 data-i18n="adminMode"></h2>
  <label class="switch-row">
    <input type="checkbox" id="adminMode">
    <span data-i18n-html="adminModeDesc"></span>
  </label>

  <h2 data-i18n="scanDirs"></h2>
  <p style="color:#888;font-size:14px" data-i18n="scanDirsDesc"></p>
  <ul id="dirs" class="dirs"></ul>
  <div class="add-row">
    <input id="newDir" data-i18n-placeholder="dirPlaceholder">
    <button class="btn" id="add" data-i18n="add"></button>
  </div>
  <button class="btn primary" id="save" data-i18n="save"></button>
  <button class="btn" id="scan" data-i18n="rescan"></button>
  <div class="status" id="status"></div>
  <div class="progress"><div id="bar"></div></div>

  <h2 data-i18n="searchIndex"></h2>
  <p style="color:#888;font-size:14px" data-i18n="searchIndexDesc"></p>
  <button class="btn" id="buildIdx" data-i18n="buildIndex"></button>
  <div class="status" id="idxStatus"></div>
</main>
<script src="/admin.js"></script>
<script>
I18n.apply();
// 语言：只存在本机浏览器里，换了以后刷新页面生效
const langSel = document.getElementById('lang');
langSel.innerHTML = [['', t('langAuto')], ...Object.entries(I18n.LANGS)].map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
langSel.value = I18n.saved in I18n.LANGS ? I18n.saved : '';
langSel.onchange = () => { I18n.set(langSel.value); location.reload(); };
document.getElementById('adminMode').checked = Admin.on();
document.getElementById('adminMode').onchange = (e) => Admin.set(e.target.checked);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let dirs = [];

function render() {
  document.getElementById('dirs').innerHTML = dirs.map((d, i) => `
    <li><input value="${esc(d)}" data-i="${i}"><button class="btn" data-del="${i}">${t('delete')}</button></li>`).join('')
    || `<li style="color:#888">${t('noDirs')}</li>`;
}
document.getElementById('dirs').addEventListener('input', (e) => {
  if (e.target.dataset.i !== undefined) dirs[Number(e.target.dataset.i)] = e.target.value;
});
document.getElementById('dirs').addEventListener('click', (e) => {
  if (e.target.dataset.del !== undefined) { dirs.splice(Number(e.target.dataset.del), 1); render(); }
});
document.getElementById('add').onclick = () => {
  const v = document.getElementById('newDir').value.trim();
  if (v) { dirs.push(v); document.getElementById('newDir').value = ''; render(); }
};
document.getElementById('save').onclick = async () => {
  const cfg = await fetch('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scanDirs: dirs }) }).then((r) => r.json());
  dirs = cfg.scanDirs; render();
  document.getElementById('status').textContent = t('saved');
};
document.getElementById('scan').onclick = async () => {
  await fetch('/api/scan', { method: 'POST' });
  poll();
};
async function poll() {
  const st = await fetch('/api/scan/status').then((r) => r.json());
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  document.getElementById('scan').disabled = st.running;
  if (st.running) {
    status.textContent = st.phase === 'collect' ? t('collecting') : t('processing', { done: st.done, total: st.total });
    bar.style.width = st.total ? (st.done / st.total * 100) + '%' : '0';
    setTimeout(poll, 1000);
  } else if (st.phase === 'done') {
    status.textContent = t('scanDone', { n: st.done });
    bar.style.width = '100%';
  } else if (st.phase === 'error') {
    status.textContent = t('scanError', { err: st.error });
  } else {
    status.textContent = '';
  }
}
fetch('/api/config').then((r) => r.json()).then((cfg) => { dirs = cfg.scanDirs; render(); });
// 本机局域网地址：其他设备的浏览器打开这些地址就能看
fetch('/api/info').then((r) => (r.ok ? r.json() : null)).then((info) => {
  if (!info || !info.addresses || !info.addresses.length) return;
  const el = document.getElementById('lan');
  el.hidden = false;
  el.innerHTML = esc(t('lanOpen')) + info.addresses.map((a) => `<code>${esc(a)}</code>`).join(' ');
}).catch(() => {});
poll();

function showIndexStatus(st) {
  const el = document.getElementById('idxStatus');
  document.getElementById('buildIdx').textContent = t(st.built ? 'rebuildIndex' : 'buildIndex');
  if (!st.built) { el.textContent = t('indexNone'); return; }
  el.textContent = t('indexBuilt', { shows: st.shows, eps: st.episodes, texts: st.texts || 0, at: new Date(st.builtAt).toLocaleString(I18n.lang === 'zh' ? 'zh-CN' : 'en-US') }) + (st.stale ? t('indexStale') : '');
}
document.getElementById('buildIdx').onclick = async (ev) => {
  ev.target.disabled = true;
  document.getElementById('idxStatus').textContent = t('indexBuilding');
  const res = await fetch('/api/search/index', { method: 'POST' });
  const st = await res.json().catch(() => ({}));
  if (res.ok) showIndexStatus(st); else document.getElementById('idxStatus').textContent = t('indexFailed', { err: st.error || res.status });
  ev.target.disabled = false;
};
fetch('/api/search/index').then((r) => (r.ok ? r.json() : null)).then((st) => st && showIndexStatus(st)).catch(() => {});
</script>
</body>
</html>
