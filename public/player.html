<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="动画片">
<link rel="apple-touch-icon" href="/icon-180.png">
<title data-i18n="playerTitle">播放</title>
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
<script src="/back.js"></script>
<script src="/admin.js"></script>
</head>
<body>
<header>
  <a class="icon-btn" href="/" data-back data-i18n-title="back">⬅️</a>
  <a class="icon-btn" href="/" data-i18n-title="home">🏠</a>
  <h1 id="title"></h1>
  <a class="btn" id="parentBtn" data-i18n-title="parentTip" data-i18n="parentDir" hidden></a>
</header>
<div class="player-layout">
  <div class="player-main" id="stage">
    <div class="video-wrap" id="videoWrap">
      <video id="video" autoplay playsinline></video>
      <div class="big-play" id="bigPlay" hidden>▶</div>
    </div>
    <div class="seekbar">
      <span class="time" id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="controls">
      <button id="playBtn" data-i18n-title="playPause">⏸</button>
      <button id="prev" data-i18n="prev"></button>
      <button id="next" data-i18n="next"></button>
      <span class="now" id="now"></span>
      <button id="modeSeq" data-i18n-title="modeSeqTip" data-i18n="modeSeq"></button>
      <button id="modeOne" data-i18n-title="modeOneTip" data-i18n="modeOne"></button>
      <button id="favBtn" data-i18n-title="favTip" data-i18n="favBtn"></button>
      <button id="fullBtn" data-i18n-title="fullscreen">⛶</button>
      <button id="delShow" class="danger" data-i18n-title="delShowTip" data-i18n="delShow" hidden></button>
    </div>
  </div>
  <aside class="episodes">
    <h2 id="epHead" data-i18n="episodes"></h2>
    <div id="list"></div>
  </aside>
</div>
<script>
I18n.apply();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (sec) => { sec = Math.max(0, Math.round(sec || 0)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };

const id = new URLSearchParams(location.search).get('id');
const video = document.getElementById('video');
const seek = document.getElementById('seek');
const $ = (i) => document.getElementById(i);
let show, cur = 0;
let mode = localStorage.getItem('playMode') || 'seq';
// 转码流的时间戳从 0 开始，offset 记录这段流真正的起点秒数
let offset = 0, duration = 0, dragging = false;

function ep() { return show.episodes[cur]; }
function nowTime() { return offset + (video.currentTime || 0); }

function renderMode() {
  $('modeSeq').classList.toggle('active', mode === 'seq');
  $('modeOne').classList.toggle('active', mode === 'one');
}
function setMode(m) { mode = m; localStorage.setItem('playMode', m); renderMode(); }

const useHls = !!video.canPlayType('application/vnd.apple.mpegurl');
let hlsRetried = false;

function load(i, startAt = 0) {
  hlsRetried = false;
  if (i < 0 || i >= show.episodes.length) return;
  cur = i;
  const e = ep();
  duration = e.duration || 0;
  if (e.native) {
    offset = 0;
    video.src = `/stream/${show.id}/${i}`;
    if (startAt > 0) video.currentTime = startAt;
  } else {
    offset = Math.floor(startAt);
    // Safari/iPad 播 mp4 必须支持 Range，管道流不行，改走 HLS；其它浏览器继续用管道流
    video.src = useHls
      ? `/hls/${show.id}/${i}/${offset}/index.m3u8`
      : `/stream/${show.id}/${i}` + (offset > 0 ? `?t=${offset}` : '');
  }
  video.play().catch(() => {});
  $('now').textContent = t('nowPlaying', { i: i + 1, n: show.episodes.length, title: e.title });
  $('tDur').textContent = fmt(duration);
  saveProgress(true);
  document.querySelectorAll('.ep').forEach((el, j) => el.classList.toggle('current', j === i));
  const el = document.querySelectorAll('.ep')[i];
  if (el) el.scrollIntoView({ block: 'nearest' });
  updateBar();
}

function seekTo(t) {
  if (!ep()) return;
  t = Math.max(0, Math.min(t, duration - 0.5));
  if (ep().native) {
    video.currentTime = t;
    video.play().catch(() => {});
  } else {
    load(cur, t);
  }
}

function updateBar() {
  if (dragging) return;
  const t = nowTime();
  $('tCur').textContent = fmt(t);
  seek.value = duration ? Math.round(t / duration * 1000) : 0;
}

function renderList() {
  const admin = Admin.on();
  $('epHead').textContent = t('episodesN', { n: show.episodes.length });
  $('list').innerHTML = show.episodes.map((e) => `
    <div class="ep${e.index === cur ? ' current' : ''}" data-i="${e.index}">
      <span class="n">${e.index + 1}</span>
      <span class="t">${esc(e.title)}</span>
      <span class="d">${e.duration ? fmt(e.duration) : ''}</span>
      ${admin ? `<button class="del-ep" data-i="${e.index}" title="${t('deleteEpTip')}">🗑</button>` : ''}
    </div>`).join('');
}

function renderFav() {
  $('favBtn').textContent = t(show.fav ? 'favBtnOn' : 'favBtn');
  $('favBtn').classList.toggle('active', !!show.fav);
}

async function init() {
  show = await fetch('/api/shows/' + id).then((r) => (r.ok ? r.json() : null));
  if (!show) { $('title').textContent = t('showNotFound'); return; }
  document.title = show.name;
  $('title').textContent = show.name;
  $('title').title = show.relPath;
  if (show.parent) {
    $('parentBtn').href = '/?folder=' + show.parent.id;
    $('parentBtn').textContent = '📁 ' + show.parent.name;
    $('parentBtn').hidden = false;
  }
  renderList();
  renderFav();
  $('favBtn').onclick = async () => {
    const r = await fetch('/api/favorites/' + show.id, { method: show.fav ? 'DELETE' : 'PUT' }).then((x) => x.json());
    show.fav = r.fav;
    renderFav();
  };
  $('list').addEventListener('click', async (ev) => {
    const del = ev.target.closest('.del-ep');
    if (del) {
      ev.stopPropagation();
      const e = show.episodes[Number(del.dataset.i)];
      const r = await Admin.deleteEpisode(show, e);
      if (!r) return;
      if (!r.show) { location.href = '/'; return; }
      const wasCur = e.index === cur;
      show = r.show;
      if (wasCur) {
        load(Math.min(cur, show.episodes.length - 1));   // 删的是正在播的：播同位置的下一集
      } else {
        if (e.index < cur) cur--;                          // 删的在前面：当前集序号前移
        if (ep()) $('now').textContent = t('nowPlaying', { i: cur + 1, n: show.episodes.length, title: ep().title });
      }
      renderList();
      return;
    }
    const el = ev.target.closest('.ep');
    if (el) load(Number(el.dataset.i));
  });
  if (Admin.on()) {
    $('delShow').hidden = false;
    $('delShow').onclick = async () => { if (await Admin.deleteShow(show)) location.href = '/'; };
  }
  renderMode();
  // 从服务端读取上次进度：接着上次的集数和时间点播放；快播完的就从下一集开头开始
  // 搜索结果点进来带 ?ep= 指定集：播这一集（上次正好看到这集就接着看，否则从头）
  const epParam = new URLSearchParams(location.search).get('ep');
  const ep = epParam === null ? -1 : Number(epParam);
  const pr = await fetch('/api/progress/' + show.id).then((r) => r.json()).catch(() => null);
  if (new URLSearchParams(location.search).has('pick')) {
    // 搜索命中的是目录里的文本（字幕等）：不自动播，让用户从右边列表自己选。
    // cur = -1 表示还没选集，这期间不保存进度（否则会把这个节目原来的断点覆盖成第 1 集 0 秒）
    cur = -1;
    $('now').textContent = t('pickEpisode');
  } else if (Number.isInteger(ep) && ep >= 0 && ep < show.episodes.length) {
    load(ep, pr && pr.index === ep && pr.time > 3 ? pr.time : 0);
  } else if (pr && pr.index < show.episodes.length) {
    const d = show.episodes[pr.index].duration || 0;
    if (d && pr.time > d - 15) {
      if (pr.index + 1 < show.episodes.length) load(pr.index + 1); else load(0);
    } else {
      load(pr.index, pr.time > 3 ? pr.time : 0);
    }
  } else {
    load(0);
  }
}

// 进度保存：播放中每 5 秒一次，暂停/切集/离开页面时立即保存
let lastSaved = 0;
function saveProgress(force, beacon) {
  if (!show || !ep()) return;
  const now = Date.now();
  if (!force && now - lastSaved < 5000) return;
  lastSaved = now;
  const body = JSON.stringify({ index: cur, time: Math.floor(nowTime()) });
  if (beacon && navigator.sendBeacon) {
    navigator.sendBeacon('/api/progress/' + show.id, new Blob([body], { type: 'application/json' }));
  } else {
    fetch('/api/progress/' + show.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {});
  }
}
video.addEventListener('timeupdate', () => { if (!video.paused) saveProgress(false); });
video.addEventListener('pause', () => saveProgress(true));
window.addEventListener('pagehide', () => saveProgress(true, true));

// 进度条：拖动时只更新显示，松手才真正跳转
seek.addEventListener('input', () => { dragging = true; $('tCur').textContent = fmt(seek.value / 1000 * duration); });
seek.addEventListener('change', () => { dragging = false; seekTo(seek.value / 1000 * duration); });
video.addEventListener('timeupdate', updateBar);
video.addEventListener('durationchange', () => {
  // 原生 mp4 以浏览器读到的时长为准
  if (ep() && ep().native && isFinite(video.duration) && video.duration > 0) { duration = video.duration; $('tDur').textContent = fmt(duration); }
});

// 播放/暂停
function togglePlay() { if (video.paused) video.play().catch(() => {}); else video.pause(); }
$('playBtn').onclick = togglePlay;
// 全屏且控件已隐藏时，点画面只是把控件叫出来，不切换播放
// （pointerdown 会先把控件显示出来，所以要记住按下那一刻是不是隐藏的）
let hiddenAtDown = false;
video.addEventListener('pointerdown', () => { hiddenAtDown = $('stage').classList.contains('ui-hidden'); });
video.addEventListener('click', () => { if (hiddenAtDown) { hiddenAtDown = false; showUi(); return; } togglePlay(); });
$('bigPlay').onclick = togglePlay;
video.addEventListener('play', () => { $('playBtn').textContent = '⏸'; $('bigPlay').hidden = true; });
video.addEventListener('pause', () => { $('playBtn').textContent = '▶'; $('bigPlay').hidden = false; });

$('prev').onclick = () => load(cur - 1);
$('next').onclick = () => load(cur + 1);
$('modeSeq').onclick = () => setMode('seq');
$('modeOne').onclick = () => setMode('one');
// 全屏时控件自动隐藏：3 秒没操作就藏起来，碰一下画面再出来
let uiTimer = 0;
const isFull = () => !!document.fullscreenElement;
function hideUi() { if (isFull() && !video.paused) $('stage').classList.add('ui-hidden'); }
function showUi() {
  $('stage').classList.remove('ui-hidden');
  clearTimeout(uiTimer);
  if (isFull()) uiTimer = setTimeout(hideUi, 3000);
}
['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach((ev) => $('stage').addEventListener(ev, showUi, { passive: true }));
document.addEventListener('fullscreenchange', () => { showUi(); if (!isFull()) { clearTimeout(uiTimer); $('stage').classList.remove('ui-hidden'); } });
video.addEventListener('pause', showUi);
video.addEventListener('play', showUi);

$('fullBtn').onclick = () => {
  const el = $('stage');
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iPhone
};
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') seekTo(nowTime() + 10);
  else if (e.code === 'ArrowLeft') seekTo(nowTime() - 10);
});

video.addEventListener('ended', () => {
  if (mode !== 'seq') return;
  if (cur + 1 < show.episodes.length) load(cur + 1);
  else location.href = '/';
});
video.addEventListener('error', () => {
  // HLS 会话空闲太久会被服务端清掉，从当前位置重开一次
  if (useHls && ep() && !ep().native && !hlsRetried) {
    const t = nowTime();
    load(cur, t);
    hlsRetried = true;
    return;
  }
  if (video.src) $('now').textContent += t('playFailed');
});
init();
</script>
</body>
</html>
