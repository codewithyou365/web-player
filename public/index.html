<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="动画片">
<link rel="apple-touch-icon" href="/icon-180.png">
<title data-i18n="appName">动画片</title>
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
<script src="/admin.js"></script>
<script src="/back.js"></script>
</head>
<body>
<header>
  <a class="icon-btn" href="/" id="backBtn" data-back data-i18n-title="back" hidden>⬅️</a>
  <a class="icon-btn" href="/" id="homeBtn" data-i18n-title="home" hidden>🏠</a>
  <h1 id="crumbs"></h1>
  <a class="icon-btn" href="/search.html" data-i18n-title="search">🔍</a>
  <a class="icon-btn" href="/history.html" data-i18n-title="history">🕘</a>
  <a class="icon-btn" href="/settings.html" data-i18n-title="settings">⚙️</a>
</header>
<section id="recent" class="recent" hidden>
  <h2><span data-i18n="recent"></span> <a class="more" href="/history.html" data-i18n="allHistory"></a></h2>
  <div class="recent-row" id="recentRow"></div>
</section>
<h2 class="section-title" id="allTitle" data-i18n="allTitle" hidden></h2>
<main id="grid" class="grid"></main>
<script>
I18n.apply();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (sec) => { sec = Math.max(0, Math.round(sec || 0)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
const folderId = new URLSearchParams(location.search).get('folder') || '';

async function loadRecent() {
  const items = await fetch('/api/recent').then((r) => r.json());
  const sec = document.getElementById('recent');
  sec.hidden = !items.length;
  document.getElementById('allTitle').hidden = !items.length;
  document.getElementById('recentRow').innerHTML = items.map((s) => {
    const pct = s.duration ? Math.min(100, Math.round(s.time / s.duration * 100)) : 0;
    return `
    <a class="card recent-card${s.fav ? ' liked' : ''}" href="/player.html?id=${s.id}" title="${esc(s.relPath)}">
      ${favBtn(s)}
      ${s.cover ? `<img class="cover" src="${s.cover}" alt="" loading="lazy">` : `<div class="cover placeholder">🎞️</div>`}
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="name">${esc(s.name)}</div>
      <div class="sub">${t('epAt', { n: s.index + 1, time: fmt(s.time) })}</div>
    </a>`;
  }).join('');
}

function favBtn(s) {
  return `<button class="fav-btn" data-fav="${s.id}" data-on="${s.fav ? 1 : 0}" title="${t(s.fav ? 'unlike' : 'like')}">${s.fav ? '❤️' : '🤍'}</button>`;
}

// 喜欢/取消喜欢（首页网格和最近播放共用），改完整页刷新，两处的心形和排序一起更新
async function toggleFav(ev) {
  const btn = ev.target.closest('[data-fav]');
  if (!btn) return false;
  ev.preventDefault();
  await fetch('/api/favorites/' + btn.dataset.fav, { method: btn.dataset.on === '1' ? 'DELETE' : 'PUT' });
  load();
  return true;
}
document.getElementById('recentRow').onclick = toggleFav;

function coverHtml(s) {
  return s.cover ? `<img class="cover" src="${s.cover}" alt="" loading="lazy">` : `<div class="cover placeholder">${s.type === 'folder' ? '📁' : '🎞️'}</div>`;
}

function renderHeader(data) {
  const home = document.getElementById('homeBtn');
  const h = document.getElementById('crumbs');
  const back = document.getElementById('backBtn');
  if (!data.folder) { home.hidden = back.hidden = true; h.textContent = '🎬 ' + t('appName'); document.title = t('appName'); return; }
  home.hidden = back.hidden = false;
  // 直接打开的文件夹没有上一页时，返回上一级文件夹
  const parent = data.crumbs[data.crumbs.length - 1];
  back.dataset.fallback = parent ? '/?folder=' + parent.id : '/';
  const parts = [`<a href="/">${t('all')}</a>`, ...data.crumbs.map((c) => `<a href="/?folder=${c.id}">${esc(c.name)}</a>`), `<span>📁 ${esc(data.folder.name)}</span>`];
  h.innerHTML = parts.join('<span class="sep">›</span>');
  document.title = data.folder.name;
}

async function load() {
  if (!folderId) loadRecent();
  const grid = document.getElementById('grid');
  const res = await fetch('/api/browse' + (folderId ? '?folder=' + folderId : ''));
  if (!res.ok) { location.href = '/'; return; }
  const data = await res.json();
  renderHeader(data);
  const admin = Admin.on();
  // 喜欢的节目放最前面（服务端已按喜欢时间倒序排好），然后是文件夹，再是其它节目
  const favs = data.shows.filter((s) => s.fav);
  const items = [...favs, ...data.folders, ...data.shows.filter((s) => !s.fav)];
  if (!items.length) {
    grid.innerHTML = folderId
      ? `<div class="empty">${t('emptyFolder')}</div>`
      : `<div class="empty">${t('emptyLibrary')}</div>`;
    if (!folderId) setTimeout(load, 3000);
    return;
  }
  grid.innerHTML = items.map((s) => s.type === 'folder' ? `
    <a class="card folder-card" href="/?folder=${s.id}" title="${esc(t('folderTip', { path: s.relPath, n: s.count }))}" data-id="${s.id}">
      ${admin && s.archived !== false ? `<button class="del-btn unarchive" data-unarchive="${s.id}" title="${t('unarchiveTip')}">📂</button>` : ''}
      ${coverHtml(s)}
      <div class="info">${esc(s.relPath)}<br>${t('nShows', { n: s.count })}</div>
      <div class="name">📁 ${esc(s.name)}</div>
    </a>` : `
    <a class="card${s.fav ? ' liked' : ''}" href="/player.html?id=${s.id}" title="${esc(t('showTip', { path: s.relPath, n: s.count }))}" data-id="${s.id}">
      ${favBtn(s)}
      ${admin ? `<button class="del-btn archive" data-archive="${s.id}" title="${t('archiveTip')}">🗂</button><button class="del-btn" data-del="${s.id}" title="${t('deleteShowTip')}">🗑</button>` : ''}
      ${coverHtml(s)}
      <div class="info">${esc(s.relPath)}<br>${t('nEps', { n: s.count })}</div>
      <div class="name">${esc(s.name)}</div>
    </a>`).join('');

  grid.onclick = async (ev) => {
    if (await toggleFav(ev)) return;
    if (!admin) return;
    const del = ev.target.closest('[data-del]');
    const arc = ev.target.closest('[data-archive]');
    const un = ev.target.closest('[data-unarchive]');
    if (!del && !arc && !un) return;
    ev.preventDefault();
    if (del) {
      const s = data.shows.find((x) => x.id === del.dataset.del);
      if (s && (await Admin.deleteShow(s))) load();
    } else if (arc) {
      const s = data.shows.find((x) => x.id === arc.dataset.archive);
      if (s && (await Admin.archiveShow(s))) load();
    } else if (un) {
      const f = data.folders.find((x) => x.id === un.dataset.unarchive);
      if (f && (await Admin.unarchive(f))) load();
    }
  };
}
load();
</script>
</body>
</html>
