<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动画片</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>🎬 动画片</h1>
  <a class="icon-btn" href="/settings.html" title="设置">⚙️</a>
</header>
<section id="recent" class="recent" hidden>
  <h2>▶️ 最近播放</h2>
  <div class="recent-row" id="recentRow"></div>
</section>
<h2 class="section-title" id="allTitle" hidden>📚 全部</h2>
<main id="grid" class="grid"></main>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (sec) => { sec = Math.max(0, Math.round(sec || 0)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };

async function loadRecent() {
  const items = await fetch('/api/recent').then((r) => r.json());
  const sec = document.getElementById('recent');
  sec.hidden = !items.length;
  document.getElementById('allTitle').hidden = !items.length;
  document.getElementById('recentRow').innerHTML = items.map((s) => {
    const pct = s.duration ? Math.min(100, Math.round(s.time / s.duration * 100)) : 0;
    return `
    <a class="card recent-card" href="/player.html?id=${s.id}" title="${esc(s.relPath)}">
      ${s.cover ? `<img class="cover" src="${s.cover}" alt="" loading="lazy">` : `<div class="cover placeholder">🎞️</div>`}
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="name">${esc(s.name)}</div>
      <div class="sub">第 ${s.index + 1} 集 · 看到 ${fmt(s.time)}</div>
    </a>`;
  }).join('');
}

async function load() {
  loadRecent();
  const grid = document.getElementById('grid');
  const { shows } = await fetch('/api/shows').then((r) => r.json());
  if (!shows.length) {
    grid.innerHTML = '<div class="empty">还没有节目。<br>正在扫描，或者到 <a href="/settings.html">设置</a> 添加目录。</div>';
    setTimeout(load, 3000);
    return;
  }
  grid.innerHTML = shows.map((s) => `
    <a class="card" href="/player.html?id=${s.id}" title="${esc(s.relPath)}（${s.count} 集）">
      ${s.cover ? `<img class="cover" src="${s.cover}" alt="" loading="lazy">` : `<div class="cover placeholder">🎞️</div>`}
      <div class="info">${esc(s.relPath)}<br>共 ${s.count} 集</div>
      <div class="name">${esc(s.name)}</div>
    </a>`).join('');
}
load();
</script>
</body>
</html>
